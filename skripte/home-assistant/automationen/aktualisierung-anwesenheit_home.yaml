alias: Aktualisierung Anwesenheit Home
description: >-
  Aktualisiert die Anwesenheits-Booleans aller Personen anhand ihrer
  Handy-Tracker. Bei home wird die Person als anwesend, bei not_home als
  abwesend markiert. Bei unknown oder unavailable bleibt der letzte
  Anwesenheitsstatus erhalten.
triggers:
  - trigger: state
    entity_id:
      - device_tracker.josiane_handy
      - device_tracker.marco_handy
      - device_tracker.rowan_handy
      - device_tracker.tamara_handy
      - device_tracker.victor_handy
  - trigger: homeassistant
    event: start
conditions: []
actions:
  - repeat:
      for_each:
        - josiane
        - marco
        - rowan
        - tamara
        - victor
      sequence:
        - choose:
            - conditions:
                - condition: template
                  value_template: >-
                    {{ is_state('device_tracker.' ~ repeat.item ~ '_handy',
                    'home') }}
              sequence:
                - action: input_boolean.turn_on
                  target:
                    entity_id: input_boolean.anwesend_{{ repeat.item }}
            - conditions:
                - condition: template
                  value_template: >-
                    {{ is_state('device_tracker.' ~ repeat.item ~ '_handy',
                    'not_home') }}
              sequence:
                - action: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.anwesend_{{ repeat.item }}
mode: restart
