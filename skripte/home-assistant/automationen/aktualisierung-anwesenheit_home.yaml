alias: Aktualisierung OwnTracks Anwesenheit Home
description: >-
  Aktualisiert die Anwesenheits-Helfer anhand des OwnTracks-Attributs in_zones.
  Bei unbekanntem oder nicht verfügbarem Tracker bleibt der letzte Status erhalten.
triggers:
  - trigger: state
    entity_id:
      - device_tracker.person1_smartphoneowntracks
      - device_tracker.person2_smartphoneowntracks
  - trigger: homeassistant
    event: start
conditions: []
actions:
  - repeat:
      for_each:
        - tracker: device_tracker.person1_smartphoneowntracks
          helfer: input_boolean.anwesend_person1
        - tracker: device_tracker.person2_smartphoneowntracks
          helfer: input_boolean.anwesend_person2
      sequence:
        - variables:
            tracker: "{{ repeat.item.tracker }}"
            helfer: "{{ repeat.item.helfer }}"
        - if:
            - condition: template
              value_template: "{{ states(tracker) not in ['unknown', 'unavailable'] }}"
          then:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ 'zone.home' in (state_attr(tracker, 'in_zones') or []) }}"
                  sequence:
                    - action: input_boolean.turn_on
                      target:
                        entity_id: "{{ helfer }}"
              default:
                - action: input_boolean.turn_off
                  target:
                    entity_id: "{{ helfer }}"
mode: restart
