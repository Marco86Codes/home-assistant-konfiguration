alias: Zendure Leistungsanpassung
description: 'Leistungsanpassung von Zendure 1 und Zendure 2 bei Abweichung zwischen berechneter AC-Soll-Leistung und eingestelltem Ausgangslimit.'
triggers:
  - trigger: time_pattern
    seconds: /5
  - trigger: numeric_state
    entity_id: sensor.shelly_netzleistung_gesamt
    below: 0
conditions:
  - condition: or
    conditions:
      - condition: template
        value_template: |
          {{ states('sensor.zendure_1_ac_soll_leistung') | int(0) !=
             states('number.solarflow_800_plus_1_output_limit') | int(0) }}
      - condition: template
        value_template: |
          {{ states('sensor.zendure_2_ac_soll_leistung') | int(0) !=
             states('number.solarflow_800_plus_2_output_limit') | int(0) }}
actions:
  - action: number.set_value
    target:
      entity_id: number.solarflow_800_plus_1_output_limit
    data:
      value: '{{ states(''sensor.zendure_1_ac_soll_leistung'') | int(0) }}'
  - action: number.set_value
    target:
      entity_id: number.solarflow_800_plus_2_output_limit
    data:
      value: '{{ states(''sensor.zendure_2_ac_soll_leistung'') | int(0) }}'
mode: single
