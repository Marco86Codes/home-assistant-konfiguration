    icon: mdi:account-check

  anwesend_person5_radar:
    name: Anwesend Person 5 Radar
    icon: mdi:account-check

  home_office_person1:
    name: Home Office Person 1
    icon: mdi:account-check

template:
  - sensor:
      # PERSON 2 ANWESENHEIT - PRÜFUNG
      - name: "Person 2 Anwesenheit Prüfung"
        unique_id: person2_anwesenheit_prufung
        icon: mdi:home-account
        availability: >
          {{ states('person.person2') not in ['unknown', 'unavailable'] }}
        state: >
          {% if is_state('person.person2', 'not_home') %}
            not_home
          {% else %}
            home
          {% endif %}

