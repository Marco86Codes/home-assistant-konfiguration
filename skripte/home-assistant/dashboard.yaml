views:
  - title: Solar
    path: solar
    icon: mdi:solar-power
    type: sections
    sections:
      - type: grid
        columns: 1
        square: false
        cards:
          - type: markdown
            content: |
              ### Zendure 1
            text_only: true
            card_mod:
              style:
                .: |
                  ha-card {
                    background: transparent !important;
                    box-shadow: none !important;
                    border: none !important;
                  }
                ha-markdown$: |
                  h3 {
                    text-align: center !important;
                    font-size: 24px !important;
                  }
          - type: custom:config-template-card
            entities:
              - input_number.zendure_1_neuer_min_soc
              - number.solarflow_800_plus_1_min_soc
            card:
              type: gauge
              entity: sensor.solarflow_800_plus_1_electric_level
              name: ''
              min: 0
              max: 100
              needle: true
              tap_action:
                action: none
              segments:
                - from: 0
                  color: '#E74C3C'
                - from: ${Number(states['number.solarflow_800_plus_1_min_soc'].state)}
                  color: >-
                    ${Number(states['input_number.zendure_1_neuer_min_soc'].state)
                    >
                      Number(states['number.solarflow_800_plus_1_min_soc'].state)
                      ? '#3498DB' : '#E0E0E0'}
                - from: |-
                    ${Math.max(
                      Number(states['number.solarflow_800_plus_1_min_soc'].state),
                      Number(states['input_number.zendure_1_neuer_min_soc'].state)
                    )}
                  color: '#E0E0E0'
              card_mod:
                style: |
                  ha-card {
                    background: transparent !important;
                    box-shadow: none !important;
                    border: none !important;
                    margin-top: -12px !important;
                    margin-bottom: -16px !important;
                  }
                  ha-tile-icon {
                    display: none !important;
                  }
                  .card-content {
                    padding: 0px !important;
                  }
          - square: false
            type: grid
            columns: 3
            cards:
              - type: tile
                entity: sensor.solarflow_800_plus_1_solar_power1
                name: PV 1
                icon: none
                show_entity_picture: false
                vertical: true
                tap_action:
                  action: none
                features_position: bottom
                card_mod:
                  style:
                    .: |
                      ha-card {
                        background: transparent !important;
                        box-shadow: none !important;
                        border: none !important;
                        margin-top: 0px !important;
                        margin-bottom: -4px !important;
                      }
                      ha-tile-icon {
                        display: none !important;
                      }
                    ha-tile-info$: |
                      .primary {
                        font-size: 14px !important;
                      }
                      .secondary {
                        font-size: 16px !important;
                      }
              - type: tile
                entity: sensor.solarflow_800_plus_1_solar_power2
                name: PV 2
                icon: none
                show_entity_picture: false
                vertical: true
                tap_action:
                  action: none
                features_position: bottom
                card_mod:
                  style:
                    .: |
                      ha-card {
                        background: transparent !important;
                        box-shadow: none !important;
                        border: none !important;
                        margin-top: 0px !important;
                        margin-bottom: -4px !important;
                      }
                      ha-tile-icon {
                        display: none !important;
                      }
                    ha-tile-info$: |
                      .primary {
                        font-size: 14px !important;
                      }
                      .secondary {
                        font-size: 16px !important;
                      }
              - type: tile
                entity: sensor.zendure_1_pv_leistung
                name: Gesamt
                icon: none
                show_entity_picture: false
                vertical: true
                tap_action:
                  action: none
                features_position: bottom
                card_mod:
                  style:
                    .: |
                      ha-card {
                        background: transparent !important;
                        box-shadow: none !important;
                        border: none !important;
                        margin-top: 0px !important;
                        margin-bottom: -4px !important;
                      }
                      ha-tile-icon {
                        display: none !important;
                      }
                    ha-tile-info$: |
                      .primary {
                        font-size: 14px !important;
                      }
                      .secondary {
                        font-size: 16px !important;
                      }
          - square: false
            type: grid
            columns: 3
            card_mod:
              style: |
                :host {
                  border-top: 2px solid #E0E0E0 !important;
                }
            cards:
              - type: tile
                entity: sensor.solarflow_800_plus_1_output_home_power
                name: Einspeisung
                icon: none
                show_entity_picture: false
                vertical: true
                tap_action:
                  action: none
                features_position: bottom
                card_mod:
                  style:
                    .: |
                      ha-card {
                        background: transparent !important;
                        box-shadow: none !important;
                        border: none !important;
                        margin-top: 0px !important;
                        margin-bottom: -4px !important;
                      }
                      ha-tile-icon {
                        display: none !important;
                      }
                    ha-tile-info$: |
                      .primary {
                        font-size: 14px !important;
                      }
                      .secondary {
                        font-size: 16px !important;
                      }
              - type: tile
                entity: sensor.zendure_1_ac_soll_leistung
                name: Einspeisung neu
                icon: none
                show_entity_picture: false
                vertical: true
                tap_action:
                  action: none
                features_position: bottom
                card_mod:
                  style:
                    .: |
                      ha-card {
                        {% set aktuell = states('number.solarflow_800_plus_1_output_limit') | float(none) %}
                        {% set geplant = states('sensor.zendure_1_ac_soll_leistung') | float(none) %}
                        {% if aktuell is not none and geplant is not none and aktuell != geplant %}
                          background: #3498DB !important;
                        {% else %}
                          background: transparent !important;
                        {% endif %}
                        box-shadow: none !important;
                        border: none !important;
                        margin-top: 0px !important;
                        margin-bottom: -4px !important;
                      }
                      ha-tile-icon {
                        display: none !important;
                      }
                    ha-tile-info$: |
                      .primary {
                        font-size: 14px !important;
                      }
                      .secondary {
                        font-size: 16px !important;
                      }
              - type: tile
                entity: sensor.zendure_1_leistungsanteil
                name: Anteil
                icon: none
                show_entity_picture: false
                vertical: true
                tap_action:
                  action: none
                features_position: bottom
                card_mod:
                  style:
                    .: |
                      ha-card {
                        background: transparent !important;
                        box-shadow: none !important;
                        border: none !important;
                        margin-top: 0px !important;
                        margin-bottom: -4px !important;
                      }
                      ha-tile-icon {
                        display: none !important;
                      }
                    ha-tile-info$: |
                      .primary {
                        font-size: 14px !important;
                      }
                      .secondary {
                        font-size: 16px !important;
                      }
          - type: grid
            square: false
            columns: 3
            cards:
              - type: custom:button-card
                entity: sensor.solarflow_800_plus_1_output_pack_power
                triggers_update:
                  - sensor.solarflow_800_plus_1_output_pack_power
                  - sensor.solarflow_800_plus_1_pack_input_power
                show_icon: false
                show_name: true
                show_state: true
                name: |
                  [[[
                    const ladung = Number(
                      states['sensor.solarflow_800_plus_1_output_pack_power']?.state
                    );
                    const entladung = Number(
                      states['sensor.solarflow_800_plus_1_pack_input_power']?.state
                    );

                    if (ladung > 0) return "Ladung";
                    if (entladung > 0) return "Entladung";
                    return "Standby";
                  ]]]
                state_display: |
                  [[[
                    const ladung = Number(
                      states['sensor.solarflow_800_plus_1_output_pack_power']?.state
                    );
                    const entladung = Number(
                      states['sensor.solarflow_800_plus_1_pack_input_power']?.state
                    );

                    if (ladung > 0) return ladung + " W";
                    if (entladung > 0) return (-entladung) + " W";
                    return "0 W";
                  ]]]
                styles:
                  card:
                    - background: transparent
                    - box-shadow: none
                    - border: none
                    - padding: 8px 2px
                    - margin-bottom: -4px
                  grid:
                    - grid-template-areas: '"n" "s"'
                    - grid-template-columns: 1fr
                    - grid-template-rows: auto auto
                    - row-gap: 4px
                  name:
                    - font-size: 14px
                    - font-weight: normal
                    - justify-self: center
                  state:
                    - font-size: 16px
                    - font-weight: normal
                    - justify-self: center
                    - color: |
                        [[[
                          const ladung = Number(states['sensor.solarflow_800_plus_1_output_pack_power']?.state);
                          const entladung = Number(states['sensor.solarflow_800_plus_1_pack_input_power']?.state);

                          return ladung <= 0 && entladung > 0
                            ? '#E74C3C'
                            : 'var(--primary-text-color)';
                        ]]]
                tap_action:
                  action: none
              - type: tile
                entity: sensor.zendure_1_pv_begrenzung_anzeige
                name: PV Begrenzung
                icon: none
                show_entity_picture: false
                vertical: true
                tap_action:
                  action: none
                features_position: bottom
                card_mod:
                  style:
                    .: |
                      ha-card {
                        {% if not is_state('sensor.zendure_1_pv_begrenzung_anzeige', 'Inaktiv') %}
                          background: #F4D03F !important;
                        {% else %}
                          background: transparent !important;
                        {% endif %}
                        box-shadow: none !important;
                        border: none !important;
                        margin-top: 0px !important;
                        margin-bottom: -4px !important;
                      }
                      ha-tile-icon {
                        display: none !important;
                      }
                    ha-tile-info$: |
                      .primary {
                        font-size: 14px !important;
                        {% if not is_state('sensor.zendure_1_pv_begrenzung_anzeige', 'Inaktiv') %}
                          color: black !important;
                        {% endif %}
                      }
                      .secondary {
                        font-size: 16px !important;
                        {% if not is_state('sensor.zendure_1_pv_begrenzung_anzeige', 'Inaktiv') %}
                          color: black !important;
                        {% endif %}
                      }
              - type: custom:button-card
                entity: sensor.solarflow_800_plus_1_hyper_tmp
                triggers_update:
                  - sensor.solarflow_800_plus_1_hyper_tmp
                  - sensor.ab2000_1_max_temp
                show_icon: false
                show_name: false
                show_state: false
                custom_fields:
                  wr: |
                    [[[
                      const s = states['sensor.solarflow_800_plus_1_hyper_tmp']?.state;
                      const t = Number(s);

                      return s !== 'unknown' &&
                             s !== 'unavailable' &&
                             s !== undefined &&
                             Number.isFinite(t)
                        ? Math.trunc(t) + " °C"
                        : "–";
                    ]]]
                  akku: |
                    [[[
                      const s = states['sensor.ab2000_1_max_temp']?.state;
                      const t = Number(s);

                      return s !== 'unknown' &&
                             s !== 'unavailable' &&
                             s !== undefined &&
                             Number.isFinite(t)
                        ? Math.trunc(t) + " °C"
                        : "–";
                    ]]]
                styles:
                  card:
                    - padding: 8px 0px
                    - background: transparent
                    - border: none
                    - box-shadow: none
                    - margin-bottom: -4px
                  grid:
                    - grid-template-areas: '"wr akku"'
                    - grid-template-columns: 1fr 1fr
                    - grid-template-rows: 1fr
                  custom_fields:
                    wr:
                      - padding: 4px 0px
                      - border-right: 1px solid var(--divider-color)
                      - font-size: 16px
                      - background: |
                          [[[
                            const s = states['sensor.solarflow_800_plus_1_hyper_tmp']?.state;
                            const t = Math.trunc(Number(s));

                            return s !== 'unknown' &&
                                   s !== 'unavailable' &&
                                   s !== undefined &&
                                   Number.isFinite(t) &&
                                   (t < 0 || t > 60)
                              ? '#E74C3C'
                              : 'transparent';
                          ]]]
                    akku:
                      - padding: 4px 0px
                      - font-size: 16px
                      - background: |
                          [[[
                            const s = states['sensor.ab2000_1_max_temp']?.state;
                            const t = Math.trunc(Number(s));

                            return s !== 'unknown' &&
                                   s !== 'unavailable' &&
                                   s !== undefined &&
                                   Number.isFinite(t) &&
                                   (t < 0 || t > 40)
                              ? '#E74C3C'
                              : 'transparent';
                          ]]]
                extra_styles: |
                  #wr::before {
                    content: "WR";
                    display: block;
                    font-size: 14px;
                    margin-bottom: 4px;
                  }

                  #akku::before {
                    content: "Akku";
                    display: block;
                    font-size: 14px;
                    margin-bottom: 4px;
                  }
                tap_action:
                  action: none
        card_mod:
          style: |
            :host {
              border-left: 2px solid #B0B0B0;
              border-right: 2px solid #B0B0B0;
              padding-left: 8px;
              padding-right: 8px;
              margin-right: -14px;
              box-sizing: border-box;
            }
