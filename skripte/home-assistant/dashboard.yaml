views:
  - title: Solar
    path: solar
    icon: mdi:solar-power
    type: sections
    sections:
      - type: grid
        columns: 1
        square: false
        cards:
          - type: markdown
            content: |
              ### Zendure 1
            text_only: true
            card_mod:
              style:
                .: |
                  ha-card {
                    background: transparent !important;
                    box-shadow: none !important;
                    border: none !important;
                  }
                ha-markdown$: |
                  h3 {
                    text-align: center !important;
                    font-size: 24px !important;
                  }
          - type: custom:config-template-card
            entities:
              - input_number.zendure_1_neuer_min_soc
              - number.solarflow_800_plus_1_min_soc
            card:
              type: gauge
              entity: sensor.solarflow_800_plus_1_electric_level
              name: ''
              min: 0
              max: 100
              needle: true
              tap_action:
                action: none
              segments:
                - from: 0
                  color: '#E74C3C'
                - from: ${Number(states['number.solarflow_800_plus_1_min_soc'].state)}
                  color: >-
                    ${Number(states['input_number.zendure_1_neuer_min_soc'].state)
                    >
                      Number(states['number.solarflow_800_plus_1_min_soc'].state)
                      ? '#3498DB' : '#E0E0E0'}
                - from: |-
                    ${Math.max(
                      Number(states['number.solarflow_800_plus_1_min_soc'].state),
                      Number(states['input_number.zendure_1_neuer_min_soc'].state)
                    )}
                  color: '#E0E0E0'
              card_mod:
                style: |
                  ha-card {
                    background: transparent !important;
                    box-shadow: none !important;
                    border: none !important;
                    margin-top: -8px !important;
                    margin-bottom: -8px !important;
                  }
                  ha-tile-icon {
                    display: none !important;
                  }
                  .card-content {
                    padding: 0px !important;
                  }
          - square: false
            type: grid
            columns: 3
            cards:
              - type: tile
                entity: sensor.solarflow_800_plus_1_solar_power1
                name: PV 1
                icon: none
                show_entity_picture: false
                vertical: true
                tap_action:
                  action: none
                features_position: bottom
                card_mod:
                  style:
                    .: |
                      ha-card {
                        background: transparent !important;
                        box-shadow: none !important;
                        border: none !important;
                        margin-top: 0px !important;
                        margin-bottom: -4px !important;
                      }
                      ha-tile-icon {
                        display: none !important;
                      }
                    ha-tile-info$: |
                      .primary {
                        font-size: 14px !important;
                      }
                      .secondary {
                        font-size: 16px !important;
                      }
              - type: tile
                entity: sensor.solarflow_800_plus_1_solar_power2
                name: PV 2
                icon: none
                show_entity_picture: false
                vertical: true
                tap_action:
                  action: none
                features_position: bottom
                card_mod:
                  style:
                    .: |
                      ha-card {
                        background: transparent !important;
                        box-shadow: none !important;
                        border: none !important;
                        margin-top: 0px !important;
                        margin-bottom: -4px !important;
                      }
                      ha-tile-icon {
                        display: none !important;
                      }
                    ha-tile-info$: |
                      .primary {
                        font-size: 14px !important;
                      }
                      .secondary {
                        font-size: 16px !important;
                      }
              - type: tile
                entity: sensor.zendure_1_pv_leistung
                name: Gesamt
                icon: none
                show_entity_picture: false
                vertical: true
                tap_action:
                  action: none
                features_position: bottom
                card_mod:
                  style:
