                  margin-bottom: -4px !important;
                }

                table tr,
                table tr:nth-child(even),
                table tr:nth-child(odd),
                table td {
                  background: transparent !important;
                }

                {% set batterien = states.sensor
                  | selectattr('entity_id', 'match', 'sensor\\.kontakt.*_battery$')
                  | sort(attribute='name') | list %}

                {% for batterie in batterien %}
                  {% set wert = batterie.state | float(100) %}

                  {% if wert < 25 %}
                    table tbody tr:nth-child({{ loop.index }}) td {
                      color: #E74C3C !important;
                    }
                  {% elif wert < 50 %}
                    table tbody tr:nth-child({{ loop.index }}) td:nth-child(2) {
                      color: #3498DB !important;
                    }
                  {% endif %}
                {% endfor %}
            entities:
              include:
                - sensor.kontakt*_battery
            css:
              table+: 'width: 100%; table-layout: fixed;'
              thead tr th:nth-child(1)+: 'width: 5%;'
              thead tr th:nth-child(2)+: 'width: 65%;'
              thead tr th:nth-child(3)+: 'width: 25%;'
